spring.application.name=backendpetsalud

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

petsalud.admin.email=${PETSALUD_ADMIN_EMAIL:}
petsalud.admin.password=${PETSALUD_ADMIN_PASSWORD:}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.auditoria.seguridad=INFO
